<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 240"
     role="img" aria-label="Three overlapping territorial contours representing the Product, Craft, and People domains, connected by dashed paths across a landscape">
  <!-- Horizon / ground line -->
  <line x1="30" y1="160" x2="370" y2="160"
        stroke="var(--color-diagram-stroke)" stroke-width="1" stroke-dasharray="8,4" />

  <!-- Territory: Product (left) -->
  <ellipse cx="120" cy="110" rx="90" ry="50"
           fill="var(--color-diagram-fill)"
           stroke="var(--color-diagram-stroke)" stroke-width="1.5" />
  <text x="120" y="105"
        font-family="Crimson Pro, Georgia, serif" font-size="15"
        fill="var(--color-ink)" text-anchor="middle" font-weight="600">Product</text>
  <text x="120" y="125"
        font-family="Crimson Pro, Georgia, serif" font-size="11"
        fill="var(--color-ink-muted)" text-anchor="middle">What we build</text>

  <!-- Territory: Craft (center, slightly lower) -->
  <ellipse cx="210" cy="140" rx="85" ry="48"
           fill="var(--color-diagram-fill)"
           stroke="var(--color-diagram-stroke)" stroke-width="1.5" />
  <text x="210" y="135"
        font-family="Crimson Pro, Georgia, serif" font-size="15"
        fill="var(--color-ink)" text-anchor="middle" font-weight="600">Craft</text>
  <text x="210" y="155"
        font-family="Crimson Pro, Georgia, serif" font-size="11"
        fill="var(--color-ink-muted)" text-anchor="middle">How we work</text>

  <!-- Territory: People (right) -->
  <ellipse cx="295" cy="110" rx="85" ry="50"
           fill="var(--color-diagram-fill)"
           stroke="var(--color-diagram-stroke)" stroke-width="1.5" />
  <text x="295" y="105"
        font-family="Crimson Pro, Georgia, serif" font-size="15"
        fill="var(--color-ink)" text-anchor="middle" font-weight="600">People</text>
  <text x="295" y="125"
        font-family="Crimson Pro, Georgia, serif" font-size="11"
        fill="var(--color-ink-muted)" text-anchor="middle">How we grow</text>

  <!-- Paths between territories -->
  <line x1="180" y1="140" x2="155" y2="130"
        stroke="var(--color-diagram-stroke)" stroke-width="1" stroke-dasharray="6,4" />
  <line x1="255" y1="145" x2="240" y2="135"
        stroke="var(--color-diagram-stroke)" stroke-width="1" stroke-dasharray="6,4" />

  <!-- Topographic contour lines (decorative, below ground line) -->
  <path d="M50,200 Q120,180 200,205 Q280,230 350,195"
        fill="none" stroke="var(--color-diagram-stroke)" stroke-width="0.75" opacity="0.5" />
  <path d="M60,215 Q140,195 220,218 Q300,240 340,210"
        fill="none" stroke="var(--color-diagram-stroke)" stroke-width="0.75" opacity="0.5" />
</svg>
