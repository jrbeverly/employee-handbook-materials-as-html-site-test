<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 200"
     role="img" aria-label="Weekly rhythm diagram showing five working days arranged in a circle with labeled rituals">
  <!-- Circle of days -->
  <circle cx="180" cy="100" r="75"
          fill="none" stroke="var(--color-diagram-stroke)" stroke-width="1" />

  <!-- Day nodes arranged around the circle -->
  <!-- Monday (top) -->
  <circle cx="180" cy="30" r="16"
          fill="var(--color-diagram-fill)" stroke="var(--color-diagram-stroke)" stroke-width="1" />
  <text x="180" y="34"
        font-family="Crimson Pro, Georgia, serif" font-size="11"
        fill="var(--color-ink)" text-anchor="middle" font-weight="600">Mon</text>
  <text x="180" y="14"
        font-family="Crimson Pro, Georgia, serif" font-size="9"
        fill="var(--color-ink-muted)" text-anchor="middle">Check-in</text>

  <!-- Tuesday (upper right) -->
  <circle cx="247" cy="55" r="16"
          fill="var(--color-diagram-fill)" stroke="var(--color-diagram-stroke)" stroke-width="1" />
  <text x="247" y="59"
        font-family="Crimson Pro, Georgia, serif" font-size="11"
        fill="var(--color-ink)" text-anchor="middle" font-weight="600">Tue</text>
  <text x="247" y="72"
        font-family="Crimson Pro, Georgia, serif" font-size="9"
        fill="var(--color-ink-muted)" text-anchor="middle">Build</text>

  <!-- Wednesday (right) -->
  <circle cx="255" cy="105" r="16"
          fill="var(--color-accent-light)" stroke="var(--color-accent)" stroke-width="1.5" />
  <text x="255" y="109"
        font-family="Crimson Pro, Georgia, serif" font-size="11"
        fill="var(--color-accent)" text-anchor="middle" font-weight="600">Wed</text>
  <text x="278" y="109"
        font-family="Crimson Pro, Georgia, serif" font-size="9"
        fill="var(--color-ink-muted)" text-anchor="start">Deep work</text>

  <!-- Thursday (lower right) -->
  <circle cx="247" cy="150" r="16"
          fill="var(--color-diagram-fill)" stroke="var(--color-diagram-stroke)" stroke-width="1" />
  <text x="247" y="154"
        font-family="Crimson Pro, Georgia, serif" font-size="11"
        fill="var(--color-ink)" text-anchor="middle" font-weight="600">Thu</text>
  <text x="278" y="154"
        font-family="Crimson Pro, Georgia, serif" font-size="9"
        fill="var(--color-ink-muted)" text-anchor="start">Office hours</text>

  <!-- Friday (bottom) -->
  <circle cx="180" cy="170" r="16"
          fill="var(--color-diagram-fill)" stroke="var(--color-diagram-stroke)" stroke-width="1" />
  <text x="180" y="174"
        font-family="Crimson Pro, Georgia, serif" font-size="11"
        fill="var(--color-ink)" text-anchor="middle" font-weight="600">Fri</text>
  <text x="180" y="192"
        font-family="Crimson Pro, Georgia, serif" font-size="9"
        fill="var(--color-ink-muted)" text-anchor="middle">Demo &amp; reflect</text>

  <!-- Center label -->
  <text x="180" y="104"
        font-family="Crimson Pro, Georgia, serif" font-size="11" font-style="italic"
        fill="var(--color-ink-muted)" text-anchor="middle">The weekly</text>
  <text x="180" y="118"
        font-family="Crimson Pro, Georgia, serif" font-size="11" font-style="italic"
        fill="var(--color-ink-muted)" text-anchor="middle">cadence</text>
</svg>
