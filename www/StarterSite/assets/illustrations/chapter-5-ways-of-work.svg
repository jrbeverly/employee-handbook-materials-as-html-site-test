<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 240"
     role="img" aria-label="Connected nodes showing the cycle of communication, decision-making, and weekly rhythm in the organization">
  <!-- Three main nodes in a horizontal sequence -->
  <!-- Node 1: Communication -->
  <circle cx="80" cy="120" r="38"
          fill="var(--color-diagram-fill)"
          stroke="var(--color-diagram-stroke)" stroke-width="1.5" />
  <text x="80" y="115"
        font-family="Crimson Pro, Georgia, serif" font-size="13"
        fill="var(--color-ink)" text-anchor="middle" font-weight="600">Write</text>
  <text x="80" y="132"
        font-family="Crimson Pro, Georgia, serif" font-size="10"
        fill="var(--color-ink-muted)" text-anchor="middle">Async first</text>

  <!-- Connector arrow 1→2 -->
  <line x1="118" y1="120" x2="152" y2="120"
        stroke="var(--color-diagram-stroke)" stroke-width="1" stroke-dasharray="6,4" />
  <polygon points="158,120 148,115 148,125"
           fill="var(--color-diagram-stroke)" stroke="none" />

  <!-- Node 2: Decision -->
  <circle cx="200" cy="120" r="38"
          fill="var(--color-diagram-fill)"
          stroke="var(--color-diagram-stroke)" stroke-width="1.5" />
  <text x="200" y="115"
        font-family="Crimson Pro, Georgia, serif" font-size="13"
        fill="var(--color-ink)" text-anchor="middle" font-weight="600">Decide</text>
  <text x="200" y="132"
        font-family="Crimson Pro, Georgia, serif" font-size="10"
        fill="var(--color-ink-muted)" text-anchor="middle">Record it</text>

  <!-- Connector arrow 2→3 -->
  <line x1="238" y1="120" x2="272" y2="120"
        stroke="var(--color-diagram-stroke)" stroke-width="1" stroke-dasharray="6,4" />
  <polygon points="278,120 268,115 268,125"
           fill="var(--color-diagram-stroke)" stroke="none" />

  <!-- Node 3: Deliver -->
  <circle cx="320" cy="120" r="38"
          fill="var(--color-diagram-fill)"
          stroke="var(--color-diagram-stroke)" stroke-width="1.5" />
  <text x="320" y="115"
        font-family="Crimson Pro, Georgia, serif" font-size="13"
        fill="var(--color-ink)" text-anchor="middle" font-weight="600">Ship</text>
  <text x="320" y="132"
        font-family="Crimson Pro, Georgia, serif" font-size="10"
        fill="var(--color-ink-muted)" text-anchor="middle">Demo it</text>

  <!-- Feedback loop from 3 back to 1 -->
  <path d="M320,158 Q320,200 200,200 Q80,200 80,158"
        fill="none" stroke="var(--color-accent)" stroke-width="1" stroke-dasharray="4,4" />
  <polygon points="80,152 74,162 86,162"
           fill="var(--color-accent)" stroke="none" />
  <text x="200" y="218"
        font-family="Crimson Pro, Georgia, serif" font-size="10" font-style="italic"
        fill="var(--color-accent)" text-anchor="middle">Reflect &amp; improve</text>
</svg>
